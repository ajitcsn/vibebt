services:
  - type: web
    name: vibebt
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: VIBEBT_HOST
        value: 0.0.0.0
      - key: VIBEBT_MAX_CONCURRENT_RUNS
        value: "2"
      - key: VIBEBT_MAX_REQUESTS_PER_MINUTE
        value: "30"
